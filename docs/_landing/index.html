  <style>
    /* Strict Monochrome Theme - Nominal Design Language */
    :root {
      --bg-dark: #000000;
      --bg-card: #09090b;
      --bg-card-hover: #121215;
      --border-subtle: #27272a;
      --border-faint: #18181b;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle background grid pattern */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      width: 100%;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-logo {
      display: block;
      height: 20px;
      width: auto;
    }

    .brand-divider {
      color: var(--text-dim);
      font-weight: 300;
    }

    .sub-brand {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .nav-link:hover {
      color: var(--text-main);
    }

    /* Hero Section */
    main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 2rem 5rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hero {
      text-align: center;
      max-width: 800px;
      margin-bottom: 3.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-logo {
      height: 72px;
      width: auto;
      margin-bottom: 1.75rem;
      filter: brightness(0) invert(1); /* Invert pure black logo SVG to crisp white for dark mode */
    }

    .hero-title {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 1.25rem;
    }

    .hero-subtitle {
      font-size: 1.125rem;
      color: var(--text-muted);
      line-height: 1.6;
      font-weight: 400;
      max-width: 640px;
      margin: 0 auto;
    }

    /* 3 Large Cards Section */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      width: 100%;
      max-width: 1080px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      min-height: 260px;
    }

    /* Active Card Styling (Python) */
    .card.active {
      border-color: #ffffff;
      background-color: #0d0d10;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
    }

    a.card {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    .card.active:hover {
      transform: translateY(-4px);
      background-color: var(--bg-card-hover);
      border-color: #ffffff;
    }

    /* Disabled Cards Styling (MATLAB / LabVIEW) */
    .card.disabled {
      opacity: 0.35;
      border-color: var(--border-faint);
      cursor: not-allowed;
      filter: grayscale(100%);
    }

    .card-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 1.5rem;
    }

    .card-btn {
      width: 100%;
      padding: 0.75rem 1.25rem;
      border-radius: 0px;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .card.active .card-btn {
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
    }

    .card.active:hover .card-btn {
      background-color: #e4e4e7;
      border-color: #e4e4e7;
    }

    .card.disabled .card-btn {
      background-color: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border-subtle);
      pointer-events: none;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 10;
      width: 100%;
      border-top: 1px solid var(--border-subtle);
      background-color: var(--bg-dark);
    }

    .footer-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-text {
      color: var(--text-dim);
      font-size: 0.8125rem;
      font-family: var(--font-mono);
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8125rem;
      transition: color 0.15s ease;
    }

    .footer-link:hover {
      color: var(--text-main);
    }

    /* Responsive Design */
    @media (max-width: 868px) {
      .cards-grid {
        grid-template-columns: 1fr;
        max-width: 400px;
      }
      
      .hero {
        margin-bottom: 2.5rem;
      }

      .footer-container {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
    }
  </style>
</head>
