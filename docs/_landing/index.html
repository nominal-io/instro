<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instro | Open-Source Hardware Instrumentation</title>
  <link rel="icon" href="python/_static/favicon.png">

  <!-- Google Analytics (GA4), same property as the docs -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LR7QM29GGQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-LR7QM29GGQ");
  </script>
  
  <!-- Fonts matching nominal.io -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>
    /* Strict Monochrome Theme - Nominal Design Language */
    :root {
      --bg-dark: #000000;
      --bg-card: #09090b;
      --bg-card-hover: #121215;
      --border-subtle: #27272a;
      --border-faint: #18181b;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle background grid pattern */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      width: 100%;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-logo-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-mark {
      width: 24px;
      height: 24px;
      background: #ffffff;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      font-family: var(--font-mono);
      clip-path: polygon(0% 0%, 100% 0%, 85% 100%, 0% 100%);
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    .brand-divider {
      color: var(--text-dim);
      font-weight: 300;
    }

    .sub-brand {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .nav-link:hover {
      color: var(--text-main);
    }

    /* Hero Section */
    main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 2rem 5rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hero {
      text-align: center;
      max-width: 800px;
      margin-bottom: 3.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-logo {
      height: 72px;
      width: auto;
      margin-bottom: 1.75rem;
      filter: brightness(0) invert(1); /* Invert pure black logo SVG to crisp white for dark mode */
    }

    .hero-title {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 1.25rem;
    }

    .hero-subtitle {
      font-size: 1.125rem;
      color: var(--text-muted);
      line-height: 1.6;
      font-weight: 400;
      max-width: 640px;
      margin: 0 auto;
    }

    /* 3 Large Cards Section */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      width: 100%;
      max-width: 1080px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      min-height: 260px;
    }

    /* Active Card Styling (Python) */
    .card.active {
      border-color: #ffffff;
      background-color: #0d0d10;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
    }

    a.card {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    .card.active:hover {
      transform: translateY(-4px);
      background-color: var(--bg-card-hover);
      border-color: #ffffff;
    }

    /* Disabled Cards Styling (MATLAB / LabVIEW) */
    .card.disabled {
      opacity: 0.35;
      border-color: var(--border-faint);
      cursor: not-allowed;
      filter: grayscale(100%);
    }

    .card-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 1.5rem;
    }

    .card-btn {
      width: 100%;
      padding: 0.75rem 1.25rem;
      border-radius: 0px;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .card.active .card-btn {
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
    }

    .card.active:hover .card-btn {
      background-color: #e4e4e7;
      border-color: #e4e4e7;
    }

    .card.disabled .card-btn {
      background-color: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border-subtle);
      pointer-events: none;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 10;
      width: 100%;
      border-top: 1px solid var(--border-subtle);
      background-color: var(--bg-dark);
    }

    .footer-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-text {
      color: var(--text-dim);
      font-size: 0.8125rem;
      font-family: var(--font-mono);
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8125rem;
      transition: color 0.15s ease;
    }

    .footer-link:hover {
      color: var(--text-main);
    }

    /* Responsive Design */
    @media (max-width: 868px) {
      .cards-grid {
        grid-template-columns: 1fr;
        max-width: 400px;
      }
      
      .hero {
        margin-bottom: 2.5rem;
      }

      .footer-container {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <a href="https://nominal.io/" class="brand-group" target="_blank" rel="noopener noreferrer">
        <div class="brand-logo-wrapper">
          <div class="logo-mark">N</div>
          <span class="brand-title">NOMINAL</span>
        </div>
        <span class="brand-divider">/</span>
        <span class="sub-brand">INSTRO</span>
      </a>

      <nav class="nav-links">
        <a href="https://nominal.io/" class="nav-link" target="_blank" rel="noopener noreferrer">Nominal.io ↗</a>
        <a href="https://github.com/nominal-io/instro" class="nav-link" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </nav>
    </div>
  </header>

  <!-- Hero Content -->
  <main>
    <section class="hero">
      <!-- Instro logo, from the docs build (python/_static) -->
      <img
        src="python/_static/logo/instro-logo-solid-black.svg"
        alt="Instro Logo"
        class="hero-logo"
      />
     
      <p class="hero-subtitle">
        Open-source, vendor-agnostic libraries for interfacing with test equipment.
      </p>
    </section>

    <!-- Language Selector Cards (MATLAB - PYTHON - LABVIEW) -->
    <section class="cards-grid">
      
      <!-- 1. MATLAB (Left / Disabled) -->
      <div class="card disabled">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4 4h16v16H4z"/>
            <path d="M4 12h16M12 4v16"/>
            <circle cx="8" cy="8" r="1" fill="currentColor"/>
            <circle cx="16" cy="8" r="1" fill="currentColor"/>
            <circle cx="8" cy="16" r="1" fill="currentColor"/>
            <circle cx="16" cy="16" r="1" fill="currentColor"/>
          </svg>
        </div>
        <h2 class="card-title">MATLAB</h2>
        <span class="card-btn">Planned</span>
      </div>

      <!-- 2. Python (Center / Active): the whole card links to the docs -->
      <a class="card active" href="python/">
        <div class="card-icon" style="color: #ffffff;">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.914 0C5.82 0 6.182 2.646 6.182 2.646l.006 2.735H12.18v.822H3.926S0 5.75 0 11.908c0 6.16 3.42 5.922 3.42 5.922h2.043v-2.87s-.112-3.424 3.364-3.424h5.728s3.252.056 3.252-3.136V3.424S18.336 0 11.914 0zm-3.08 1.86c.552 0 1 .448 1 1s-.448 1-1 1-1-.448-1-1 .448-1 1-1zm3.252 22.14c6.094 0 5.732-2.646 5.732-2.646l-.006-2.735h-5.992v-.822h8.254S24 18.25 24 12.092c0-6.16-3.42-5.922-3.42-5.922h-2.043v2.87s.112 3.424-3.364 3.424H9.445s-3.252-.056-3.252 3.136v5.184s-.528 3.424 5.894 3.424zm3.08-1.86c-.552 0-1-.448-1-1s.448-1 1-1 1 .448 1 1-.448 1-1 1z"/>
          </svg>
        </div>
        <h2 class="card-title">Python</h2>
        <span class="card-btn">
          Documentation
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
      </a>

      <!-- 3. LabVIEW (Right / Disabled) -->
      <div class="card disabled">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 3h18v18H3z"/>
            <path d="M7 8l4 8 6-10"/>
          </svg>
        </div>
        <h2 class="card-title">LabVIEW</h2>
        <span class="card-btn">Planned</span>
      </div>

    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-container">
      <div class="footer-text">
        © Nominal Inc. — Open-Source Hardware Infrastructure
      </div>
      <div class="footer-links">
        <a href="https://nominal.io/" class="footer-link" target="_blank" rel="noopener noreferrer">Nominal Platform</a>
        <a href="https://nominal.io/blog/why-the-instrumentation-library-exists" class="footer-link" target="_blank" rel="noopener noreferrer">Blog Post</a>
        <a href="https://github.com/nominal-io/instro" class="footer-link" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </div>
  </footer>

</body>
</html>
