[package]
name = "instro-quantus-py"
version = "0.1.0"
license = "Apache-2.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
name = "_quantus"
crate-type = ["cdylib"]

[dependencies]
instro-quantus-rs = { path = "../../crates/instro-quantus", package = "instro-quantus" }
# pyo3/numpy move in lockstep (rust-numpy tracks pyo3 versions) and must match
# the workspace's single pyo3-ffi version (links = "python").
pyo3 = { version = "0.29", default-features = false, features = ["abi3-py310", "extension-module", "macros", "generate-import-lib"] }
numpy = "0.29"
serde_json = "1"
