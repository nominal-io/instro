[project]
name = "instro-quantus"
version = "0.1.0"
description = "Mecalc QuantusSeries DAQ mainframe support for instro: config-driven rack setup with a native streaming backend"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
dependencies = ["instro", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/nominal-io/instro"
Repository = "https://github.com/nominal-io/instro"
Issues = "https://github.com/nominal-io/instro/issues"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.uv.sources]
instro = { workspace = true }

[tool.uv]
# uv's default cache key is this pyproject.toml only; the compiled extension's
# Rust sources (here and in the core crate outside this package dir) must be
# keyed too, or `uv sync` serves a stale wheel after Rust-only changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../../Cargo.lock" },
    { file = "../../crates/instro-quantus/Cargo.toml" },
    { file = "../../crates/instro-quantus/src/**/*.rs" },
]

[tool.maturin]
bindings = "pyo3"
module-name = "instro.unstable.quantus._quantus"
python-source = "."
