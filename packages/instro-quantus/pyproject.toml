[project]
name = "instro-quantus"
version = "0.1.0"
description = "Mecalc QuantusSeries DAQ mainframe support for instro"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
# `quantus` is the Rust-backed wheel from the quantus repo (crates/quantus-py);
# not yet published — install from a local build during development.
dependencies = ["instro", "quantus>=0.1.0"]

[project.optional-dependencies]
can = ["cantools>=39.0"]

[project.urls]
Homepage = "https://github.com/nominal-io/instro"
Repository = "https://github.com/nominal-io/instro"
Issues = "https://github.com/nominal-io/instro/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
instro = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["instro"]
