[project]
name = "instro-opcua"
version = "0.1.0"
description = "Synchronous OPC UA client primitives with typed attribute values"
readme = "README.md"
keywords = ["opcua", "opc-ua", "industrial-automation", "instrument-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = ["instro"]

[project.urls]
Homepage = "https://github.com/nominal-io/instro"
Documentation = "https://instro.nominal.io"
Repository = "https://github.com/nominal-io/instro"
Issues = "https://github.com/nominal-io/instro/issues"
Changelog = "https://github.com/nominal-io/instro/releases"

[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[tool.uv.sources]
instro = { workspace = true }

[tool.maturin]
bindings = "pyo3"
module-name = "instro.unstable._opcua"
python-source = "."
