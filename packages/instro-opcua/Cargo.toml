[package]
name = "instro-opcua-py"
version = "0.1.1"
publish = false
license = "Apache-2.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "_opcua"
crate-type = ["cdylib", "rlib"]

[dependencies]
async-channel = "2.5"
async-opcua.workspace = true
instro-opcua-macros = { path = "../../crates/instro-opcua-macros" }
pyo3.workspace = true
paste = "1"
uuid.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util.workspace = true
pollster = "0.4"
tracing.workspace = true
dirs = "7.0.0"

[dev-dependencies]
tempfile = "3"
instro-opcua-test.workspace = true

[lints]
workspace = true
