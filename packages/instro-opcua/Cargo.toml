[package]
name = "instro-opcua-py"
version = "0.1.1"
publish = false
license = "Apache-2.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "_opcua"
crate-type = ["cdylib", "rlib"]

[dependencies]
async-opcua.workspace = true
pyo3.workspace = true
paste = "1"
uuid.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util.workspace = true
pollster = "0.4"
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
instro-opcua-test.workspace = true

[lints]
workspace = true
