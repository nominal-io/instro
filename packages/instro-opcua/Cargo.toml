[package]
name = "instro-opcua-py"
version = "0.1.1"
publish = false
license = "Apache-2.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "_opcua"
crate-type = ["cdylib", "rlib"]

[dependencies]
instro-opcua = { path = "../../crates/instro-opcua" }
pyo3 = { version = "0.29.0", default-features = false, features = ["abi3-py310", "macros"] }
