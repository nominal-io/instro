[project]
name = "instro-unstable"
version = "1.4.1"
description = "Unstable modules for instro (in-development features)"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
dependencies = [
    "instro",
    "python-can>=4.3",
    "gs-usb>=0.3",
    "libusb-package>=1.0.26",
    "pyserial>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
instro = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["instro"]
