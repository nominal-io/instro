[package]
name = "instro-simulation-physics"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.93"

[lib]
name = "_physics"
crate-type = ["cdylib"]

[dependencies]
instro-simulation-physics-rs = { path = "../instro-simulation-physics-rs" }
pyo3 = { version = "0.29.0", default-features = false, features = ["abi3-py310", "extension-module", "macros"] }
