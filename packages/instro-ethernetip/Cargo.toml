[package]
name = "instro-ethernetip-py"
version = "1.0.0"
publish = false
license = "Apache-2.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "_ethernetip"
crate-type = ["cdylib", "rlib"]

[dependencies]
instro-ethernetip-rs = { path = "../../crates/instro-ethernetip", features = ["blocking"], package = "instro-ethernetip" }
pyo3 = { version = "0.29.0", default-features = false, features = ["abi3-py310", "macros"] }
