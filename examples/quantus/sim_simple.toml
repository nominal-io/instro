# Minimal simulated rack for simple_stream.py: one ICP/voltage module.
# Launch (from the instro repo root):
#   cargo run -p instro-quantus-sim -- examples/quantus/sim_simple.toml
[system]
chassis = "MicroQ"
serial = "SIM-SIMPLE"
master_sampling_rate = 131072

[server]
rest_port = 8081
stream_port = 8086

[[slots]]
slot = 1
module = "ICS425"

[[slots.channels]]
index = 1
signal = { kind = "sine", frequency_hz = 50.0, amplitude = 2.5 }
