[package]
name = "instro-quantus"
version = "0.1.0"
description = "Client for Mecalc QuantusSeries DAQ mainframes (QServer Q2.x): REST configuration and binary data streaming"
license = "Apache-2.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
name = "instro_quantus"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
toml = "0.8"

[dev-dependencies]
instro-quantus-sim = { path = "../instro-quantus-sim" }
ureq = { version = "2", features = ["json"] }
