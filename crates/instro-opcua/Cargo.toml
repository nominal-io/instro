[package]
name = "instro-opcua"
version = "1.0.0"
license = "Apache-2.0"
description = "Instro OPC UA driver"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors = ["Carter Canedy <carter.canedy@nominal.io>"]
keywords = ["opcua", "plc", "automation", "instrumentation", "instro"]
categories = ["hardware-support", "network-programming"]
homepage = "https://instro.nominal.io"
repository = "https://github.com/nominal-io/instro"
documentation = "https://docs.rs/instro-opcua"
exclude = ["tests/client_harness.rs"]

[dependencies]
# workspace
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["time", "macros", "rt", "sync"] }
itertools.workspace = true
open62541.workspace = true
open62541-sys.workspace = true
uuid.workspace = true
futures-util.workspace = true
globset.workspace = true

# private
time = { version = "0.3", features = [
    "parsing",
    "serde",
    "serde-human-readable",
    "serde-well-known",
] }
zeroize = { version = "1.8", features = ["std"] }

[dev-dependencies]
instro-opcua-test.workspace = true
instro-test-utils.workspace = true

[lints]
workspace = true
