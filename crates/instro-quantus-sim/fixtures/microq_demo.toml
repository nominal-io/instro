# Demo rack: MicroQ with the customer's module families that have templates so far.
[system]
chassis = "MicroQ"
serial = "SIM0001"
master_sampling_rate = 131072

[server]
rest_port = 8080
stream_port = 8085
websocket_port = 8090

[[slots]]
slot = 1
module = "ICS425"

[[slots]]
slot = 2
module = "MIC42X7"

[[slots]]
slot = 3
module = "THM427"

[[slots]]
slot = 4
module = "WSB42X2"

[[slots]]
slot = 5
module = "ICT42S6"

[[slots.channels]]
index = 1
signal = { kind = "rpm", rpm = 3000.0 }

[[slots]]
slot = 6
module = "CAN42S2"

[[slots.channels]]
index = 1
signal = { kind = "constant", value = 0.0 }
playback = [
  { id = 0x18FF50E5, period_ms = 10, dlc = 8 },
  { id = 0x0CF00400, period_ms = 20, dlc = 8 },
]
