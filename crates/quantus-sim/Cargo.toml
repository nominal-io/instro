# Test-support crate: config-driven simulator that impersonates a Mecalc
# QuantusSeries device (REST plane + binary stream + fault injection).
[package]
name = "quantus-sim"
version = "0.1.0"
license = "Apache-2.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12"
toml = "0.8"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "quantus-sim"
path = "src/main.rs"
