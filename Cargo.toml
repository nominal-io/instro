[workspace]
resolver = "2"

members = [
    "crates/*",
    "packages/instro-ethernetip",
    "packages/instro-opcua",
]

[workspace.package]
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
base64 = "0.22"
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tokio = { version = "1", default-features = false }
itertools = "0.13"
open62541 = { version = "0.12", features = ["mbedtls", "x509"] }
open62541-sys = { version = "0.6", features = ["mbedtls"] }
futures-util = "0.3"
instro-opcua-test = { path = "crates/instro-opcua-test" }
instro-test-utils = { path = "crates/instro-test-utils" }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
todo = "warn"
result_large_err = "allow"

# open62541-sys builds open62541 + mbedtls through cmake, which mirrors this opt-level;
# an unoptimized mbedtls makes RSA key generation in tests take tens of seconds on MSVC.
[profile.dev.package.open62541-sys]
opt-level = 3
