name: Platform checks and tests

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      groups:
        required: true
        type: string

jobs:
  rust-check:
    runs-on: ${{ inputs.os }}
    # Run every step under bash so the bash-syntax steps below work on
    # Windows runners, which default to pwsh.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # `rustup` is available by default on GitHub runners
      - name: Install Rust
        run: rustup show
      # `check-rust` runs `cargo +nightly fmt`, which needs its own toolchain + component.
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Install cargo-nextest
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-nextest
      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep the existing cache namespace across reusable-workflow calls.
          shared-key: rust-check
          cache-on-failure: true
      - name: Rust format and lint checks
        run: |
          just check-rust
      - name: Install simulator dependencies
        run: uv sync --locked --no-install-package instro-ethernetip
      - name: Run Rust tests
        env:
          UV_NO_SYNC: "true"
        run: just test-rust
      - name: Build shared native Python artifacts
        run: |
          uv build --wheel --package instro-ethernetip --out-dir dist/ci
          uv build --sdist --package instro-ethernetip --out-dir dist/ci
      - name: Check EtherNet/IP source package
        run: uv run --no-project python tests/ethernetip/check_ethernetip_sdist.py sdist dist/ci/instro_ethernetip-*.tar.gz
      - name: Upload native Python wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eip-wheel-${{ inputs.os }}
          path: dist/ci/*.whl
          if-no-files-found: error

  python-test:
    name: Python tests (${{ inputs.os }}, ${{ matrix.python-version }}, ${{ matrix.group.name }})
    needs: rust-check
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        group: ${{ fromJSON(inputs.groups) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          save-cache: false
          python-version: ${{ matrix.python-version }}
      - name: Download native Python wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eip-wheel-${{ inputs.os }}
          path: dist/ci
      - name: Install dependencies
        run: |
          uv sync --locked --no-install-package instro-ethernetip
          uv pip install --no-deps --no-build --refresh-package instro-ethernetip dist/ci/*.whl
      - name: Run Python test group
        env:
          TEST_PATHS: ${{ toJSON(matrix.group.paths) }}
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          paths = json.loads(os.environ["TEST_PATHS"])
          if not paths:
              sys.exit("Python test group has no paths")
          sys.exit(subprocess.call([sys.executable, "-m", "pytest", *paths]))
          PY

  python-check:
    name: Python checks and packaging (${{ inputs.os }}, ${{ matrix.python-version }})
    needs: rust-check
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    # Run every step under bash so the bash-syntax steps below (e.g. the
    # `uv lock --check` guard) work on Windows runners, which default to pwsh.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Download native Python wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eip-wheel-${{ inputs.os }}
          path: dist/ci
      - name: Install dependencies
        run: |
          uv sync --locked --no-install-package instro-ethernetip
          uv pip install --no-deps --no-build --refresh-package instro-ethernetip dist/ci/*.whl
      - name: Check uv lockfile metadata
        run: |
          if ! uv lock --check; then echo '::error::uv lock --check failed; update uv and run uv sync'; exit 1; fi
      - name: Check format
        run: |
          uv run --no-sync ruff format --check
      - name: Check import order
        run: |
          uv run --no-sync ruff check
      - name: Static type check
        run: |
          uv run --no-sync mypy
      - name: Check installed EtherNet/IP wheel
        run: |
          wheels=(dist/ci/*.whl)
          INSTRO_EIP_WHEEL="${wheels[0]}" uv run --isolated --no-dev --refresh-package instro-ethernetip \
            --with-editable . --with "${wheels[0]}" --with mypy \
            python tests/ethernetip/ethernetip_wheel_smoke.py
