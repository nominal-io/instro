on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please-publish

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      group_pr_branch: ${{ steps.group_pr.outputs.branch }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.NOMBOT_CLASSIC_PERSONAL_ACCESS_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
      - name: Resolve grouped release PR
        id: group_pr
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          branch="$(
            jq --raw-output '
              .[]
              | select(.headBranchName == "release-please--branches--main")
              | .headBranchName
            ' <<< "$PRS"
          )"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  update-lockfile:
    needs: release-please
    if: ${{ needs.release-please.outputs.group_pr_branch != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.group_pr_branch }}
          token: ${{ secrets.NOMBOT_CLASSIC_PERSONAL_ACCESS_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.x"
          enable-cache: false
      - name: Update uv.lock
        run: uv lock
      - name: Commit and push uv.lock
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already up to date."
            exit 0
          fi
          git config user.name "NomBot"
          git config user.email "117409387+nominal-bot@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock with release-please version bumps"
          git push origin "HEAD:${{ needs.release-please.outputs.group_pr_branch }}"

  publish-python:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Resolve package name
        id: pkg
        run: |
          if [[ "${{ matrix.path }}" == crates/* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.path }}" = "packages/instro-ethernetip" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.path }}" = "." ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "name=instro" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "${{ matrix.path }}")" >> "$GITHUB_OUTPUT"
          fi
      - name: Build wheel and sdist
        if: ${{ steps.pkg.outputs.skip != 'true' }}
        run: uv build --package "${{ steps.pkg.outputs.name }}" --out-dir dist
      - name: Publish to PyPI
        if: ${{ steps.pkg.outputs.skip != 'true' }}
        # Pinning this one is only a partial guarantee: the action is a composite that
        # generates a Docker action at runtime pointing at
        # `ghcr.io/pypa/gh-action-pypi-publish:${{ github.action_ref }}`, so the code that
        # actually runs comes from a (mutable) registry tag lookup keyed on this SHA. pypa
        # publishes a SHA-tagged image per commit, so the pin resolves; verify that tag
        # exists in ghcr.io before bumping this SHA, or the release will fail at publish time.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  publish-crates:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    environment: crates-io-release

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}

    steps:
      - name: Filter publishable crates
        id: crate-pkg
        run: |
          if [[ "${{ matrix.path }}" == crates/* ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "${{ matrix.path }}")" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.crate-pkg.outputs.skip == 'false' }}

      - name: Install Rust
        if: ${{ steps.crate-pkg.outputs.skip == 'false' }}
        run: rustup show

      - name: Authenticate to crates.io
        if: ${{ steps.crate-pkg.outputs.skip == 'false' }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish crates to crates.io
        if: ${{ steps.crate-pkg.outputs.skip == 'false' }}
        run: cargo publish --locked --package "${{ steps.crate-pkg.outputs.name }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  build-eip-wheels:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' && contains(needs.release-please.outputs.paths_released, 'packages/instro-ethernetip') }}
    name: build-eip-wheel-${{ matrix.os }}-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build EtherNet/IP wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --compatibility pypi --out dist --manifest-path packages/instro-ethernetip/Cargo.toml
      - name: Upload EtherNet/IP wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eip-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-eip-sdist:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' && contains(needs.release-please.outputs.paths_released, 'packages/instro-ethernetip') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build EtherNet/IP sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path packages/instro-ethernetip/Cargo.toml
      - name: Verify EtherNet/IP sdist includes Rust source
        run: |
          set -euo pipefail
          sdists=(dist/instro_ethernetip-*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ] || [ ! -f "${sdists[0]}" ]; then
            echo "Expected exactly one instro-ethernetip sdist in dist" >&2
            exit 1
          fi
          python3 tests/ethernetip/check_ethernetip_sdist.py sdist "${sdists[0]}"
      - name: Upload EtherNet/IP sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eip-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-eip:
    needs:
      - release-please
      - build-eip-wheels
      - build-eip-sdist
    if: ${{ needs.release-please.outputs.releases_created == 'true' && contains(needs.release-please.outputs.paths_released, 'packages/instro-ethernetip') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download EtherNet/IP artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: eip-*
          path: dist
          merge-multiple: true
      - name: Publish EtherNet/IP artifacts to PyPI
        # See the ghcr.io caveat on the `Publish to PyPI` step above.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
