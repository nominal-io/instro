on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please-publish

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.NOMBOT_CLASSIC_PERSONAL_ACCESS_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  publish-python:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.x"
          enable-cache: false
      - name: Resolve package name
        id: pkg
        run: |
          if [[ "${{ matrix.path }}" == crates/* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.path }}" = "." ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "name=instro" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "${{ matrix.path }}")" >> "$GITHUB_OUTPUT"
          fi
      - name: Build wheel and sdist
        if: ${{ steps.pkg.outputs.skip != 'true' }}
        run: uv build --package "${{ steps.pkg.outputs.name }}" --out-dir dist
      - name: Publish to PyPI
        if: ${{ steps.pkg.outputs.skip != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-crates:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    environment: crates-io-release

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}

    steps:
      - name: Filter publishable crates
        id: crate-pkg
        run: |
          if [[ "${{ matrix.path }}" == crates/* ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "${{ matrix.path }}")" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: ${{ steps.crate-pkg.outputs.skip == 'false' }}

      - name: Install Rust
        if: ${{ steps.crate-pkg.outputs.skip == 'false' }}
        run: rustup show

      - name: Authenticate to crates.io
        if: ${{ steps.crate-pkg.outputs.skip == 'false' }}
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crates to crates.io
        if: ${{ steps.crate-pkg.outputs.skip == 'false' }}
        run: cargo publish --locked --package "${{ steps.crate-pkg.outputs.name }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
