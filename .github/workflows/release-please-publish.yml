on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please-publish

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.NOMBOT_CLASSIC_PERSONAL_ACCESS_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  publish-python:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.x"
          enable-cache: false
      - name: Resolve package name
        id: pkg
        env:
          RELEASED_PATH: ${{ matrix.path }}
        run: |
          set -euo pipefail
          if [[ "$RELEASED_PATH" == crates/* ]]; then
            # Pure-Rust crates publish to crates.io, not PyPI.
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -f "$RELEASED_PATH/Cargo.toml" ] && [ -f "$RELEASED_PATH/pyproject.toml" ] \
            && grep -q 'build-backend = "maturin"' "$RELEASED_PATH/pyproject.toml"; then
            # Mixed Rust/Python (maturin) packages are built and published by the maturin jobs below.
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASED_PATH" = "." ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "name=instro" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "$RELEASED_PATH")" >> "$GITHUB_OUTPUT"
          fi
      - name: Build wheel and sdist
        if: ${{ steps.pkg.outputs.skip != 'true' }}
        env:
          PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
        run: uv build --package "$PACKAGE_NAME" --out-dir dist
      - name: Publish to PyPI
        if: ${{ steps.pkg.outputs.skip != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-crates:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    environment: crates-io-release

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}

    steps:
      - name: Filter publishable crates
        id: crate-pkg
        run: |
          if [[ "${{ matrix.path }}" == crates/* ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "${{ matrix.path }}")" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: ${{ steps.crate-pkg.outputs.skip == 'false' }}

      - name: Install Rust
        if: ${{ steps.crate-pkg.outputs.skip == 'false' }}
        run: rustup show

      - name: Authenticate to crates.io
        if: ${{ steps.crate-pkg.outputs.skip == 'false' }}
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crates to crates.io
        if: ${{ steps.crate-pkg.outputs.skip == 'false' }}
        run: cargo publish --locked --package "${{ steps.crate-pkg.outputs.name }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Discover which released paths are mixed Rust/Python (maturin) packages under packages/
  # that wrap pure-Rust crates. These need multi-platform wheel + sdist builds instead of the
  # plain `uv build` used for pure-Python packages, so the jobs below fan out over this set.
  discover-maturin:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
      any: ${{ steps.discover.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover released maturin packages
        id: discover
        env:
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: |
          set -euo pipefail
          packages='[]'
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              packages/*) ;;
              *) continue ;;
            esac
            [ -f "$path/Cargo.toml" ] || continue
            [ -f "$path/pyproject.toml" ] || continue
            grep -q 'build-backend = "maturin"' "$path/pyproject.toml" || continue
            name="$(basename "$path")"
            packages="$(jq -c --arg path "$path" --arg name "$name" '. + [{path: $path, name: $name}]' <<<"$packages")"
          done < <(jq -r '.[]' <<<"$PATHS_RELEASED")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [ "$(jq 'length' <<<"$packages")" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

  build-maturin-wheels:
    needs:
      - release-please
      - discover-maturin
    if: ${{ needs.discover-maturin.outputs.any == 'true' }}
    name: build-wheel-${{ matrix.package.name }}-${{ matrix.platform.os }}-${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover-maturin.outputs.packages) }}
        platform:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: auto
          args: --release --locked --compatibility pypi --out dist --manifest-path ${{ matrix.package.path }}/Cargo.toml
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: maturin-wheel-${{ matrix.package.name }}-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-maturin-sdist:
    needs:
      - release-please
      - discover-maturin
    if: ${{ needs.discover-maturin.outputs.any == 'true' }}
    name: build-sdist-${{ matrix.package.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover-maturin.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path ${{ matrix.package.path }}/Cargo.toml
      - name: Verify sdist includes Rust source
        env:
          PACKAGE_PATH: ${{ matrix.package.path }}
          PACKAGE_NAME: ${{ matrix.package.name }}
        run: |
          set -euo pipefail
          dist_name="${PACKAGE_NAME//-/_}"
          sdists=(dist/"${dist_name}"-*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ] || [ ! -f "${sdists[0]}" ]; then
            echo "Expected exactly one $PACKAGE_NAME sdist in dist" >&2
            exit 1
          fi
          python3 tests/check_maturin_sdist.py sdist --package "$PACKAGE_PATH" "${sdists[0]}"
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: maturin-sdist-${{ matrix.package.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-maturin:
    needs:
      - release-please
      - discover-maturin
      - build-maturin-wheels
      - build-maturin-sdist
    if: ${{ needs.discover-maturin.outputs.any == 'true' }}
    name: publish-${{ matrix.package.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover-maturin.outputs.packages) }}
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download ${{ matrix.package.name }} artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: maturin-*-${{ matrix.package.name }}*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
