# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Check and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    # Run every step under bash so the bash-syntax steps below (e.g. the
    # `uv lock --check` guard) work on Windows runners, which default to pwsh.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: ${{ matrix.python-version }}
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # `rustup` is available by default on GitHub runners
      - name: Install Rust
        run: rustup show
      - name: Install cargo-nextest
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-nextest
      # Key the Rust cache on the runner image: a target/ built on one Ubuntu release links against
      # libraries (such as its system libpython) that the next release does not ship.
      - name: Read runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # Ubuntu 26.04 ships several LLVMs. bindgen loads the newest libclang but takes its include
      # paths from the default `clang`, and the mismatched `stdatomic.h` pair breaks open62541-sys.
      - name: Match libclang to the default clang
        if: runner.os == 'Linux'
        run: echo "LIBCLANG_PATH=$(dirname "$(dirname "$(readlink -f "$(command -v clang)")")")/lib" >> "$GITHUB_ENV"
      - name: Cache Rust build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ steps.image.outputs.os }}
      - name: Install dependencies
        run: |
          just install
      - name: Check uv lockfile metadata
        run: |
          if ! uv lock --check; then echo "::error::`uv lock --check` has failed, ensure you have the latest `uv` version installed with `uv self update` and run `uv sync`"; exit 1; fi
      - name: Check format
        run: |
          just check-format
      - name: Check import order
        run: |
          just check-imports
      - name: Static type check
        run: |
          just check-types
      - name: Run unit tests
        run: |
          just test

  rust-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Run every step under bash so the bash-syntax steps below work on
    # Windows runners, which default to pwsh.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # `rustup` is available by default on GitHub runners
      - name: Install Rust
        run: rustup show
      # `check-rust` runs `cargo +nightly fmt`, which needs its own toolchain + component.
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      # Key the Rust cache on the runner image: a target/ built on one Ubuntu release links against
      # libraries (such as its system libpython) that the next release does not ship.
      - name: Read runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # Ubuntu 26.04 ships several LLVMs. bindgen loads the newest libclang but takes its include
      # paths from the default `clang`, and the mismatched `stdatomic.h` pair breaks open62541-sys.
      - name: Match libclang to the default clang
        if: runner.os == 'Linux'
        run: echo "LIBCLANG_PATH=$(dirname "$(dirname "$(readlink -f "$(command -v clang)")")")/lib" >> "$GITHUB_ENV"
      - name: Cache Rust build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ steps.image.outputs.os }}
      - name: Rust format and lint checks
        run: |
          just check-rust
