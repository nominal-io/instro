# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Check and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    # Run every step under bash so the bash-syntax steps below (e.g. the
    # `uv lock --check` guard) work on Windows runners, which default to pwsh.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.8.x"
          enable-cache: false
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      # `rustup` is available by default on GitHub runners
      - name: Install Rust
        run: rustup show
      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        run: |
          just install
      - name: Check uv lockfile metadata
        run: |
          if ! uv lock --check; then echo "::error::`uv lock --check` has failed, ensure you have the latest `uv` version installed with `uv self update` and run `uv sync`"; exit 1; fi
      - name: Check format
        run: |
          just check-format
      - name: Check import order
        run: |
          just check-imports
      - name: Static type check
        run: |
          just check-types
      - name: Run unit tests
        run: |
          just test

  rust-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Run every step under bash so the bash-syntax steps below work on
    # Windows runners, which default to pwsh.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      # `rustup` is available by default on GitHub runners
      - name: Install Rust
        run: rustup show
      # `check-rust` runs `cargo +nightly fmt`, which needs its own toolchain + component.
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Rust format and lint checks
        run: |
          just check-rust
