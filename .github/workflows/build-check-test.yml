name: Check and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  discover-python-tests:
    name: Discover Python test groups
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.discover.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Discover groups
        id: discover
        run: |
          groups="$(python3 tests/ci/python_test_groups.py)"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  platform:
    name: Platform (${{ matrix.os }})
    needs: discover-python-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/check-test-platform.yml
    with:
      os: ${{ matrix.os }}
      groups: ${{ needs.discover-python-tests.outputs.groups }}

  # Keep the existing required status names while gating every test group.
  check-and-test:
    if: ${{ always() }}
    needs: [discover-python-tests, platform]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Require all checks and tests to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        shell: bash
        run: |
          if [[ "$RESULTS" == *'"failure"'* || "$RESULTS" == *'"cancelled"'* || "$RESULTS" == *'"skipped"'* ]]; then
            echo "::error::A required check did not succeed: $RESULTS"
            exit 1
          fi
