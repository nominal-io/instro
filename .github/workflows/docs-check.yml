name: Docs check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check-examples-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.8.x"
          enable-cache: false
          cache-dependency-glob: "uv.lock"
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - name: Install dependencies
        run: just install
      - name: Regenerate Mintlify examples
        run: just gen-examples
      - name: Verify no drift
        run: |
          git add -A docs/guides/instrumentation/examples docs/guides/docs.json
          if ! git diff --cached --exit-code docs/guides/instrumentation/examples docs/guides/docs.json; then
            echo "::error::\`just gen-examples\` produced changes. Run it locally and commit the result."
            exit 1
          fi
