name: Docs check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check-examples-drift:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install dependencies
        run: just install
      - name: Regenerate Mintlify examples
        run: just gen-examples
      - name: Verify no drift
        run: |
          git add -A docs/guides/instrumentation/examples docs/guides/docs.json
          if ! git diff --cached --exit-code docs/guides/instrumentation/examples docs/guides/docs.json; then
            echo "::error::\`just gen-examples\` produced changes. Run it locally and commit the result."
            exit 1
          fi
