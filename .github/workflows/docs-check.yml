name: Docs check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-docs:
    runs-on: ubuntu-latest
    # statuses: write posts the "docs preview" commit status on PRs
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          # the docs dependency group needs Python >=3.12 (Sphinx 9)
          python-version: "3.13"
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install Rust
        run: rustup show
      - name: Build docs (warnings fail the build)
        run: just build-docs
      # Uploads the site as the PR's docs-site artifact, which the renderdoc Worker serves,
      # and links the preview, or the failed run, as the "docs preview" commit status
      - name: "Built docs: upload and preview"
        if: always() && github.event_name == 'pull_request'
        uses: nominal-io/nominal-sphinx-theme/.github/actions/docs-preview@3c82e356cb791063fb5bd09bfaf64be1c03ce383 # main, 2026-11-04
        with:
          path: docs/_build/dirhtml
          job-status: ${{ job.status }}

  # The check main's ruleset requires: a theme bump PR needs a passing docs build, and every other
  # PR passes. See nominal-sphinx-theme's README, "CI".
  docs-gate:
    needs: build-docs
    if: always()
    uses: nominal-io/nominal-sphinx-theme/.github/workflows/docs-gate.yml@c2e3280c9eba544212d52b3920aabf41713cc0cb # main, 2026-10-29
    with:
      docs-result: ${{ needs.build-docs.result }}
