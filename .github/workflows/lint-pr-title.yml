name: Conventional commit lint
on:
  pull_request:
    types: ["opened", "edited", "reopened", "synchronize"]

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lint pr name
        env:
          TITLE: ${{ github.event.pull_request.title }}
        # Resolved per run via npx rather than `npm install -g`: commitlint is ESM since v19
        # and resolves `extends` from the invoking tree, which a global install does not
        # reliably provide. Both packages are pinned exactly and must be bumped together.
        run: |
          echo "$TITLE" | npx --yes -p @commitlint/cli@21.2.1 -p @commitlint/config-conventional@21.2.0 commitlint --config .github/commitlint.config.js
      - name: display helpful error message
        if: failure()
        run: |
          echo "🚨 Your PR Title: \"${{ github.event.pull_request.title }}\" did not pass linting" >> $GITHUB_STEP_SUMMARY
          echo "Please update it to follow conventional commit format: https://www.conventionalcommits.org/" >> $GITHUB_STEP_SUMMARY
